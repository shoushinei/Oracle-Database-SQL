site_name: Silver SQL 論点潰しテキスト
site_description: ORACLE MASTER Silver SQL（1Z0-071）の問題を「判定基準」で解くための論点別テキスト
site_url: https://shoushinei.github.io/Oracle-Database-SQL/
repo_url: https://github.com/shoushinei/Oracle-Database-SQL
repo_name: shoushinei/Oracle-Database-SQL
edit_uri: ""

theme:
  name: material
  language: ja
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang: ja

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - はじめに: index.md
  - 問題タイプ別の解き方: howto.md
  - 第1章 RDBとOracleの基礎: ch01.md
  - 第2章 SELECTの基礎とデータの扱い: ch02.md
  - 第3章 検索条件とソート・置換変数: ch03.md
  - 第4章 単一行関数: ch04.md
  - 第5章 変換関数・NULL関数・条件式: ch05.md
  - 第6章 集計関数とGROUP BY: ch06.md
  - 第7章 結合: ch07.md
  - 第8章 副問合せ: ch08.md
  - 第9章 集合演算: ch09.md
  - 第10章 DMLとトランザクション: ch10.md
  - 第11章 索引・シーケンス・シノニム: ch11.md
  - 第12章 DDLによる表の管理: ch12.md
  - 第13章 ビュー: ch13.md
  - 第14章 ユーザー・権限・ロール: ch14.md
  - 第15章 データディクショナリ: ch15.md
  - 第16章 タイムゾーンと期間: ch16.md
  - 付録:
      - ORAエラー逆引き: appendix-errors.md
      - 直前チェックリスト: appendix-checklist.md
